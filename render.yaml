services:
  # Express Backend Web Service
  - type: web
    name: bharatevents-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # To be provided from MongoDB Atlas connection string
      - key: FRONTEND_URL
        sync: false # To be provided from Vercel deployment URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
